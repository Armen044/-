<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Шлифовальный стол 3D</title>
<style>
html,body{margin:0;height:100%;background:#eef0f2;font-family:DejaVu Sans,Arial,sans-serif;overflow:hidden}
canvas{display:block;touch-action:none}
#ui{position:fixed;left:12px;top:12px;background:#fffe;border-radius:8px;padding:10px 12px;font-size:13px;line-height:1.7;box-shadow:0 1px 4px #0002;max-width:270px}
#ui b{font-size:14px}#ui label{display:block;cursor:pointer}
body.static #ui{display:none}
</style>
<script src="vendor/three.min.js"></script>
<script src="model.js"></script>
</head>
<body>
<div id="ui"><b>Шлифовальный стол 2800 × 700</b><br>
<label><input type="checkbox" id="hideTop"> снять столешницу (видно короб и рёбра)</label>
<label><input type="checkbox" id="hideFront"> снять лицевую панель</label>
<span style="color:#666">мышь/палец — вращать, колесо/щипок — масштаб</span></div>
<script>
const P = new URLSearchParams(location.search);
const view = P.get('view');          // front | back | open — статичные кадры для листа
if (view) document.body.classList.add('static');
const W = view ? 2000 : innerWidth, H = view ? 1400 : innerHeight;
const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
renderer.setPixelRatio(view ? 1 : devicePixelRatio);
renderer.setSize(W, H);
renderer.setClearColor(view ? 0xffffff : 0xeef0f2);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.appendChild(renderer.domElement);
const scene = new THREE.Scene();
const C = { x: DIM.L / 2, y: DIM.D / 2 };
// x → X, z (высота) → Y, y (вглубь) → -Z
const pos = (x, y, z) => new THREE.Vector3(x - C.x, z, -(y - C.y));
const MAT = {
  'ЛДСП 16 антрацит': new THREE.MeshStandardMaterial({ color: 0x55595d, roughness: 0.8 }),
  'МДФ 16': new THREE.MeshStandardMaterial({ color: 0xd8c3a0, roughness: 0.85 }),
  'МДФ 19': new THREE.MeshStandardMaterial({ color: 0xdcc8a5, roughness: 0.85 }),
};
const groups = { top: new THREE.Group(), front: new THREE.Group() };
Object.values(groups).forEach(g => scene.add(g));
function box(x0, x1, y0, y1, z0, z1, mat, parent = scene, edges = true) {
  const g = new THREE.BoxGeometry(x1 - x0, z1 - z0, y1 - y0);
  const m = new THREE.Mesh(g, mat);
  m.position.copy(pos((x0 + x1) / 2, (y0 + y1) / 2, (z0 + z1) / 2));
  m.castShadow = m.receiveShadow = true;
  if (edges) m.add(new THREE.LineSegments(new THREE.EdgesGeometry(g), new THREE.LineBasicMaterial({ color: 0x2a2a2a, transparent: true, opacity: 0.55 })));
  parent.add(m);
  return m;
}
for (const [x0, x1, y0, y1, z0, z1, mat, name] of PARTS) {
  const parent = name.startsWith('Столешница') ? groups.top : name.startsWith('Лицевая') ? groups.front : scene;
  if (name.startsWith('Ребро')) {          // ребро с проходами для воздуха: верхний пояс + 3 ножки
    const zt = z1 - 60;
    box(x0, x1, y0, y1, zt, z1, MAT[mat], parent);
    for (const [a, b] of [[y0, y0 + 100], [(y0 + y1) / 2 - 50, (y0 + y1) / 2 + 50], [y1 - 100, y1]]) box(x0, x1, a, b, z0, zt, MAT[mat], parent);
    continue;
  }
  box(x0, x1, y0, y1, z0, z1, MAT[mat], parent);
}
// прорези (инстансами)
const slotMat = new THREE.MeshBasicMaterial({ color: 0x2b241c });
function slots(list, geo, place, parent) {
  const im = new THREE.InstancedMesh(geo, slotMat, list.length);
  const m = new THREE.Matrix4();
  list.forEach((s, i) => { m.makeTranslation(...place(s).toArray()); im.setMatrixAt(i, m); });
  parent.add(im);
}
slots(TOP_SLOTS, new THREE.BoxGeometry(40, 1, 10), ([x, y]) => pos(x, y, DIM.ZT + 0.6), groups.top);
slots(WALL_SLOTS, new THREE.BoxGeometry(30, 8, 1), ([x, z]) => pos(x, DIM.D - DIM.T - 0.6, z), scene);
slots(WALL_SLOTS, new THREE.BoxGeometry(30, 8, 1), ([x, z]) => pos(x, DIM.D + 0.6, z), scene);
const fr = [];
FRONT.rows.forEach(z => FRONT.seg.forEach(([a, b]) => fr.push([a, b, z])));
fr.forEach(([a, b, z]) => box(a, b, 19.2, 20, z - 5, z + 5, slotMat, groups.front, false));
// светодиодная лента под козырьком
const led = box(DIM.T + 20, DIM.L - DIM.T - 20, DIM.D - 160, DIM.D - 140, DIM.ZW - DIM.T - 8, DIM.ZW - DIM.T, new THREE.MeshBasicMaterial({ color: 0xfffbe8 }), scene, false);
const ledLight = new THREE.PointLight(0xfff6dd, 0.5, 2500); ledLight.position.copy(pos(DIM.L / 2, DIM.D - 200, DIM.ZW - 60)); scene.add(ledLight);
// патрубки Ø160 и опоры
for (const x of OUTLETS.x) {
  const c = new THREE.Mesh(new THREE.CylinderGeometry(OUTLETS.d / 2, OUTLETS.d / 2, 120, 40), new THREE.MeshStandardMaterial({ color: 0xb8bcc0, metalness: 0.6, roughness: 0.35 }));
  c.rotation.x = Math.PI / 2; c.position.copy(pos(x, DIM.D + 60, OUTLETS.z)); c.castShadow = true; scene.add(c);
}
for (const x of [60, 936, 1864, DIM.L - 60]) for (const y of [DIM.SET + 60, DIM.D - 60]) {
  const l = new THREE.Mesh(new THREE.CylinderGeometry(22, 30, DIM.LEG, 24), new THREE.MeshStandardMaterial({ color: 0x1e1e1e }));
  l.position.copy(pos(x, y, DIM.LEG / 2)); l.castShadow = true; scene.add(l);
}
// пол
const ground = new THREE.Mesh(new THREE.PlaneGeometry(20000, 20000), view ? new THREE.ShadowMaterial({ opacity: 0.18 }) : new THREE.MeshStandardMaterial({ color: 0xdcdad5 }));
ground.rotation.x = -Math.PI / 2; ground.receiveShadow = true; scene.add(ground);
scene.add(new THREE.HemisphereLight(0xffffff, 0x9a958c, 0.85));
const sun = new THREE.DirectionalLight(0xffffff, 1.3);
sun.position.set(-1800, 4200, 3200); sun.castShadow = true;
Object.assign(sun.shadow.camera, { left: -3000, right: 3000, top: 3000, bottom: -3000, near: 100, far: 12000 });
sun.shadow.mapSize.set(2048, 2048); scene.add(sun);

const cam = new THREE.PerspectiveCamera(30, W / H, 20, 50000);
let az = -2.2, el = 0.42, dist = 6200;
if (view === 'back') { az = 0.85; el = 0.38; }
if (view === 'open') { az = -2.0; el = 0.75; dist = 5600; groups.top.visible = false; groups.front.visible = false; }
const target = new THREE.Vector3(0, 650, 0);
function place() {
  cam.position.set(target.x + dist * Math.cos(el) * Math.cos(az), target.y + dist * Math.sin(el), target.z - dist * Math.cos(el) * Math.sin(az));
  cam.lookAt(target);
}
place();
document.getElementById('hideTop').onchange = e => { groups.top.visible = !e.target.checked; draw(); };
document.getElementById('hideFront').onchange = e => { groups.front.visible = !e.target.checked; draw(); };
let drag = null, pinch = null;
const cv = renderer.domElement;
cv.addEventListener('pointerdown', e => { drag = { x: e.clientX, y: e.clientY }; cv.setPointerCapture(e.pointerId); });
cv.addEventListener('pointermove', e => {
  if (!drag || pinch) return;
  az -= (e.clientX - drag.x) * 0.006; el = Math.min(1.5, Math.max(0.02, el + (e.clientY - drag.y) * 0.005));
  drag = { x: e.clientX, y: e.clientY }; place(); draw();
});
cv.addEventListener('pointerup', () => drag = null);
cv.addEventListener('wheel', e => { e.preventDefault(); dist = Math.min(20000, Math.max(1200, dist * (1 + e.deltaY * 0.001))); place(); draw(); }, { passive: false });
cv.addEventListener('touchmove', e => {
  if (e.touches.length !== 2) { pinch = null; return; }
  const d = Math.hypot(e.touches[0].clientX - e.touches[1].clientX, e.touches[0].clientY - e.touches[1].clientY);
  if (pinch) { dist = Math.min(20000, Math.max(1200, dist * pinch / d)); place(); draw(); }
  pinch = d;
}, { passive: true });
cv.addEventListener('touchend', () => pinch = null);
addEventListener('resize', () => { if (view) return; renderer.setSize(innerWidth, innerHeight); cam.aspect = innerWidth / innerHeight; cam.updateProjectionMatrix(); draw(); });
function draw() { renderer.render(scene, cam); }
draw();
window.DONE = true;
</script>
</body>
</html>
