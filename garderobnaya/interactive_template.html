<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Гардеробная 3D</title>
<style>
  /* полноэкранная 3D-сцена, карточки сверху, панель кнопок снизу */
  :root { --bg: #efebe5; --panel: rgba(255,255,255,0.92); --ink: #2b2622; --muted: #6f655c;
          --accent: #8a6a3f; --line: #d9d1c7; --on-ink: #ffffff; --tip: rgba(30,25,20,0.88); }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) { --bg: #1d1a17; --panel: rgba(38,34,30,0.92); --ink: #eee6dc;
      --muted: #b0a597; --accent: #c9a227; --line: #4a423a; --on-ink: #1d1a17; --tip: rgba(0,0,0,0.85); color-scheme: dark; }
  }
  :root[data-theme="dark"] { --bg: #1d1a17; --panel: rgba(38,34,30,0.92); --ink: #eee6dc;
      --muted: #b0a597; --accent: #c9a227; --line: #4a423a; --on-ink: #1d1a17; --tip: rgba(0,0,0,0.85); color-scheme: dark; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink);
               font-family: -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
               overflow: hidden; -webkit-user-select: none; user-select: none; }
  #view { position: fixed; inset: 0; touch-action: none; }
  header { position: fixed; top: calc(12px + env(safe-area-inset-top, 0px)); left: 12px; right: 12px; display: flex; justify-content: space-between;
           align-items: flex-start; gap: 12px; pointer-events: none; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 10px 14px;
          box-shadow: 0 4px 18px rgba(60,40,20,0.08); pointer-events: auto; }
  h1 { margin: 0; font-size: 17px; font-weight: 650; letter-spacing: 0.2px; }
  .sub { margin-top: 3px; font-size: 13px; color: var(--muted); }
  .hint { font-size: 12.5px; color: var(--muted); line-height: 1.45; max-width: 290px; }
  nav { position: fixed; left: 50%; bottom: calc(14px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); display: flex; flex-wrap: wrap;
        justify-content: center; gap: 8px; width: min(980px, calc(100% - 24px)); }
  button { font: inherit; font-size: 14px; padding: 10px 14px; border-radius: 10px; border: 1px solid var(--line);
           background: var(--panel); color: var(--ink); cursor: pointer; min-height: 42px;
           box-shadow: 0 2px 10px rgba(60,40,20,0.08); }
  button:hover { border-color: var(--accent); }
  button.on { background: var(--ink); color: var(--on-ink); border-color: var(--ink); }
  button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  #tip { position: fixed; pointer-events: none; padding: 5px 9px; border-radius: 7px; font-size: 12.5px;
         background: var(--tip); color: #fff; display: none; white-space: nowrap; }
  @media (max-width: 640px) {
    .hint { display: none; }
    h1 { font-size: 15px; }
    button { font-size: 13px; padding: 9px 11px; }
  }
</style>
</head>
<body>
<div id="view"></div>
<header>
  <div class="card">
    <h1>Гардеробная</h1>
    <div class="sub">2400 × 1740 × 2640 мм · глубина шкафов 600 мм</div>
  </div>
  <div class="card hint">Вращайте модель мышью или пальцем, колесо / два пальца — масштаб,
    правая кнопка или два пальца — сдвиг. Нажмите на обувницу, зеркало или гладильную доску.</div>
</header>
<nav>
  <button id="bRack">Обувница: выдвинуть</button>
  <button id="bMirror">Зеркало: выдвинуть</button>
  <button id="bBoard">Гладильная доска</button>
  <button id="bLed" class="on">Подсветка</button>
  <button id="bFront">Вид от входа</button>
  <button id="bTop">Вид сверху</button>
</nav>
<div id="tip"></div>

<script>/*__THREE__*/</script>
<script>
const DATA = /*__DATA__*/;

// ---------------------------------------------------------------- сцена
const host = document.getElementById('view');
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
function syncBg() {
  renderer.setClearColor(new THREE.Color(getComputedStyle(document.documentElement).getPropertyValue('--bg').trim() || '#efebe5'));
}
syncBg();
matchMedia('(prefers-color-scheme: dark)').addEventListener('change', syncBg);
new MutationObserver(syncBg).observe(document.documentElement, { attributes: true, attributeFilter: ['data-theme'] });
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
host.appendChild(renderer.domElement);

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(45, 1, 20, 40000);

const COLORS = {
  carcass: 0x8a7e72, plinth: 0x5e554d, front: 0x9c8f82, handle: 0xc9a227, rail: 0xc9a227,
  dbox: 0xd8cfc4, dbottom: 0xe8e1d8,
  board: 0xbcd3ea, iron: 0x2f5d8a, socket: 0xffffff, mirror_frame: 0x3a3d40, mirror: 0xe3edf3,
  wall_back: 0xe8e4df, wall_left: 0xe8e4df, wall_right: 0xe8e4df, floor: 0xa8774f,
  box: 0x6b625a, shoe: 0x3d3733, shoe2: 0x8a6a52, rack: 0x3f4245, rackmesh: 0x5a5d60, bag0: 0x7a5236, bag1: 0x2e2b29, bag2: 0xc9a27a,
};
const EDGES = { carcass: 0x2a2520, plinth: 0x2a2520, front: 0x2a2520, board: 0x2f5d8a,
                mirror_frame: 0x111111, dbox: 0x8b7f72, rack: 0x1e2022 };
const LED_ON = 0xffd36b, LED_OFF = 0x6d655c;

const matCache = {};
function material(kind) {
  if (matCache[kind]) return matCache[kind];
  let m;
  if (kind === 'led') m = new THREE.MeshBasicMaterial({ color: LED_ON });
  else {
    const c = kind.startsWith('cloth') ? new THREE.Color(DATA.cloth[+kind.slice(5)]) : new THREE.Color(COLORS[kind] ?? 0x999999);
    const metal = kind === 'handle' || kind === 'rail' || kind === 'rack';
    m = new THREE.MeshStandardMaterial({ color: c, roughness: kind === 'mirror' ? 0.08 : metal ? 0.3 : 0.85,
                                         metalness: metal ? 0.6 : kind === 'mirror' ? 0.15 : 0 });
  }
  return (matCache[kind] = m);
}

// подвижные группы
const groups = {};
for (const [id, meta] of Object.entries(DATA.groups)) {
  const root = new THREE.Group();
  scene.add(root);
  const g = { id, meta, root, parent: root, slide: 0, slideTo: 0, rot: 0, rotTo: 0, state: 0 };
  if (meta.type === 'mirror' || meta.type === 'rack') {
    g.pivot = new THREE.Group();
    g.pivot.position.set(meta.pivot[0], 0, meta.pivot[1]);
    root.add(g.pivot);
    g.parent = g.pivot;
  }
  groups[id] = g;
}

const pickable = [];
const walls = {};
for (const b of DATA.boxes) {
  const [x0, x1, y0, y1, z0, z1, kind, gid] = b;
  const geo = new THREE.BoxGeometry(x1 - x0, z1 - z0, y1 - y0);
  const mesh = new THREE.Mesh(geo, material(kind));
  mesh.position.set((x0 + x1) / 2, (z0 + z1) / 2, (y0 + y1) / 2);
  mesh.castShadow = !kind.startsWith('wall') && kind !== 'floor';
  mesh.receiveShadow = true;
  let parent = scene;
  if (gid) {
    const g = groups[gid];
    parent = g.parent;
    if (g.pivot) mesh.position.sub(g.pivot.position);
    mesh.userData.gid = gid;
    pickable.push(mesh);
  }
  parent.add(mesh);
  if (EDGES[kind] !== undefined) {
    const e = new THREE.LineSegments(new THREE.EdgesGeometry(geo), new THREE.LineBasicMaterial({ color: EDGES[kind] }));
    e.position.copy(mesh.position);
    parent.add(e);
  }
  if (kind.startsWith('wall')) walls[kind] = mesh;
}

// свет
scene.add(new THREE.HemisphereLight(0xffffff, 0x8a6a50, 1.5));
const sun = new THREE.DirectionalLight(0xffffff, 1.3);
sun.position.set(900, 4200, 4200);
sun.target.position.set(1200, 0, 800);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
Object.assign(sun.shadow.camera, { left: -2400, right: 2400, top: 2400, bottom: -2400, near: 100, far: 12000 });
sun.shadow.bias = -0.0006;
scene.add(sun, sun.target);
const ledLights = [];
for (const [x, y, z] of [[1200, 2150, 650], [300, 2150, 1200], [2100, 2150, 1200], [1200, 1800, 650], [300, 1500, 1450]]) {
  const p = new THREE.PointLight(0xffc977, 0.6, 1400, 1.5);
  p.position.set(x, y, z);
  scene.add(p);
  ledLights.push(p);
}

// ---------------------------------------------------------------- камера
const target = new THREE.Vector3(1200, 1150, 870);
const sph = { r: 5600, theta: 0.32, phi: 1.12 };
function placeCamera() {
  const s = Math.sin(sph.phi);
  camera.position.set(target.x + sph.r * s * Math.sin(sph.theta),
                      target.y + sph.r * Math.cos(sph.phi),
                      target.z + sph.r * s * Math.cos(sph.theta));
  camera.lookAt(target);
  // стены, которые оказались между камерой и комнатой, скрываем
  walls.wall_back.visible = camera.position.z > 0;
  walls.wall_left.visible = camera.position.x > 0;
  walls.wall_right.visible = camera.position.x < 2400;
}
let anim = null;      // плавный переход к заданному виду
function flyTo(r, theta, phi, t) {
  theta += 2 * Math.PI * Math.round((sph.theta - theta) / (2 * Math.PI));
  anim = { from: { ...sph, t: target.clone() }, to: { r, theta, phi, t }, k: 0 };
}

function resize() {
  const w = host.clientWidth, h = host.clientHeight;
  renderer.setSize(w, h);
  camera.aspect = w / h;
  camera.fov = w < h ? 62 : 45;
  camera.updateProjectionMatrix();
}
window.addEventListener('resize', resize);
resize();

// ---------------------------------------------------------------- управление
const el = renderer.domElement;
const ptrs = new Map();
let moved = 0, panMode = false, lastPinch = 0, lastMid = null;
el.addEventListener('contextmenu', e => e.preventDefault());
el.addEventListener('pointerdown', e => {
  el.setPointerCapture(e.pointerId);
  ptrs.set(e.pointerId, { x: e.clientX, y: e.clientY });
  moved = 0;
  panMode = e.button === 2 || e.shiftKey;
  lastPinch = 0; lastMid = null;
  anim = null;
});
function pan(dx, dy) {
  const k = sph.r * 0.0011;
  const right = new THREE.Vector3().setFromMatrixColumn(camera.matrix, 0);
  const up = new THREE.Vector3().setFromMatrixColumn(camera.matrix, 1);
  target.addScaledVector(right, -dx * k).addScaledVector(up, dy * k);
}
el.addEventListener('pointermove', e => {
  hover(e);
  const p = ptrs.get(e.pointerId);
  if (!p) return;
  const dx = e.clientX - p.x, dy = e.clientY - p.y;
  p.x = e.clientX; p.y = e.clientY;
  moved += Math.abs(dx) + Math.abs(dy);
  if (ptrs.size === 1) {
    if (panMode) pan(dx, dy);
    else {
      sph.theta -= dx * 0.006;
      sph.phi = Math.min(1.62, Math.max(0.08, sph.phi - dy * 0.006));
    }
  } else if (ptrs.size === 2) {
    const [a, b] = [...ptrs.values()];
    const dist = Math.hypot(a.x - b.x, a.y - b.y);
    const mid = { x: (a.x + b.x) / 2, y: (a.y + b.y) / 2 };
    if (lastPinch) sph.r = Math.min(12000, Math.max(500, sph.r * lastPinch / dist));
    if (lastMid) pan(mid.x - lastMid.x, mid.y - lastMid.y);
    lastPinch = dist; lastMid = mid;
  }
});
function release(e) {
  if (ptrs.size === 1 && moved < 8) pick(e);
  ptrs.delete(e.pointerId);
  lastPinch = 0; lastMid = null;
}
el.addEventListener('pointerup', release);
el.addEventListener('pointercancel', e => ptrs.delete(e.pointerId));
el.addEventListener('wheel', e => {
  e.preventDefault();
  anim = null;
  sph.r = Math.min(12000, Math.max(500, sph.r * Math.exp(e.deltaY * 0.0012)));
}, { passive: false });

// ---------------------------------------------------------------- выбор деталей
const ray = new THREE.Raycaster();
function hit(e) {
  const r = el.getBoundingClientRect();
  const v = new THREE.Vector2(((e.clientX - r.left) / r.width) * 2 - 1, -((e.clientY - r.top) / r.height) * 2 + 1);
  ray.setFromCamera(v, camera);
  const h = ray.intersectObjects(pickable, false)[0];
  return h ? groups[h.object.userData.gid] : null;
}
const NAMES = { rack: 'Обувница поворотно-выдвижная ALPHALUX Aiden', mirror: 'Выдвижное поворотное зеркало', board: 'Гладильная доска' };
const tip = document.getElementById('tip');
function hover(e) {
  if (e.pointerType !== 'mouse' || ptrs.size) { tip.style.display = 'none'; return; }
  const g = hit(e);
  el.style.cursor = g ? 'pointer' : 'grab';
  if (g) {
    tip.textContent = NAMES[g.meta.type];
    tip.style.left = e.clientX + 14 + 'px';
    tip.style.top = e.clientY + 14 + 'px';
    tip.style.display = 'block';
  } else tip.style.display = 'none';
}
function pick(e) {
  const g = hit(e);
  if (!g) return;
  if (g.pivot) cycle(g);
  else setOpen(g, g.slideTo < 0.5);
  syncButtons();
}

// ---------------------------------------------------------------- действия
const rack = Object.values(groups).find(g => g.meta.type === 'rack');
const mirror = Object.values(groups).find(g => g.meta.type === 'mirror');
const board = Object.values(groups).find(g => g.meta.type === 'board');
function setOpen(g, open) { g.slideTo = open ? 1 : 0; }
function cycle(g) { g.state = (g.state + 1) % 3; }
function syncButtons() {
  bRack.textContent = ['Обувница: выдвинуть', 'Обувница: повернуть', 'Обувница: убрать'][rack.state];
  bRack.classList.toggle('on', rack.state > 0);
  bMirror.textContent = ['Зеркало: выдвинуть', 'Зеркало: повернуть', 'Зеркало: убрать'][mirror.state];
  bMirror.classList.toggle('on', mirror.state > 0);
  bBoard.classList.toggle('on', board.slideTo > 0.5);
}
const bRack = document.getElementById('bRack');
const bMirror = document.getElementById('bMirror');
const bBoard = document.getElementById('bBoard');
const bLed = document.getElementById('bLed');
bRack.onclick = () => { cycle(rack); syncButtons(); };
bMirror.onclick = () => { cycle(mirror); syncButtons(); };
bBoard.onclick = () => { setOpen(board, board.slideTo < 0.5); syncButtons(); };
bLed.onclick = () => {
  const on = !bLed.classList.contains('on');
  bLed.classList.toggle('on', on);
  matCache.led.color.setHex(on ? LED_ON : LED_OFF);
  ledLights.forEach(l => (l.intensity = on ? 0.6 : 0));
};
document.getElementById('bFront').onclick = () => flyTo(5600, 0.0, 1.32, new THREE.Vector3(1200, 1250, 870));
document.getElementById('bTop').onclick = () => flyTo(6200, 0.45, 0.42, new THREE.Vector3(1200, 900, 870));
syncButtons();

// ---------------------------------------------------------------- цикл
let last = performance.now();
function approach(v, to, step) { return Math.abs(to - v) <= step ? to : v + Math.sign(to - v) * step; }
function ease(t) { return t < 0.5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2; }
function tick(now) {
  const dt = Math.min(0.05, (now - last) / 1000);
  last = now;
  const step = dt * 1.6;
  for (const g of Object.values(groups)) {
    if (g.pivot) {
      // сначала выдвинуть, потом повернуть; обратно – в обратном порядке
      const wantSlide = g.state > 0 ? 1 : 0, wantRot = g.state === 2 ? 1 : 0;
      if (wantRot > g.rot && g.slide < 1) g.slide = approach(g.slide, 1, step);
      else if (wantSlide < g.slide && g.rot > 0) g.rot = approach(g.rot, 0, step);
      else { g.slide = approach(g.slide, wantSlide, step); g.rot = approach(g.rot, wantRot, step); }
      g.pivot.rotation.y = ease(g.rot) * (g.meta.angle ?? Math.PI / 2);
    } else g.slide = approach(g.slide, g.slideTo, step);
    const s = ease(g.slide) * g.meta.travel;
    g.root.position.set(g.meta.dir[0] * s, 0, g.meta.dir[1] * s);
  }
  if (anim) {
    anim.k = Math.min(1, anim.k + dt * 1.4);
    const k = ease(anim.k), f = anim.from, t = anim.to;
    sph.r = f.r + (t.r - f.r) * k;
    sph.theta = f.theta + (t.theta - f.theta) * k;
    sph.phi = f.phi + (t.phi - f.phi) * k;
    target.lerpVectors(f.t, t.t, k);
    if (anim.k >= 1) anim = null;
  }
  placeCamera();
  renderer.render(scene, camera);
  requestAnimationFrame(tick);
}
requestAnimationFrame(tick);
</script>
</body>
</html>
