<text x="0" y="508" font-family="DejaVu Sans, Liberation Sans, sans-serif" font-size="20" font-weight="bold" fill="#2a2620">1. Арка-монограмма · Rustamyan Atelier</text>
<text x="0" y="536" font-family="DejaVu Sans, Liberation Sans, sans-serif" font-size="15" fill="#6b645a">Арка — проём шкафа / дверь в дом. Премиум, мебель на заказ.</text></g><g transform="translate(590 150)">
<rect width="520" height="470" rx="14" fill="#2c2a27"/>
