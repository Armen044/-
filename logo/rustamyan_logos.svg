<svg xmlns="http://www.w3.org/2000/svg" width="1700" height="1320" viewBox="0 0 1700 1320"><rect width="1700" height="1320" fill="#faf8f4"/><text x="40" y="70" font-family="Liberation Serif, DejaVu Serif, serif" font-size="40" fill="#2a2620">Rustamyan — концепции логотипа</text><text x="40" y="108" font-family="DejaVu Sans, Liberation Sans, sans-serif" font-size="18" fill="#6b645a">6 направлений · цвета и шрифты — для примера, финальный вариант дорабатывается</text><g transform="translate(40 150)">
