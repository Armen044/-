<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>
<script>// Набор для «красивой» отрисовки моделей мебели на three.js (r160, UMD):
// процедурные текстуры, мягкий свет с отражениями, формы одежды/обуви/штанг.
const KIT = (() => {
  const rnd = (seed => () => ((seed = (seed * 16807) % 2147483647) - 1) / 2147483646)(12345);

  function canvasTex(size, draw, srgb = true) {
    const c = document.createElement('canvas');
    c.width = c.height = size;
    draw(c.getContext('2d'), size);
    const t = new THREE.CanvasTexture(c);
    t.wrapS = t.wrapT = THREE.RepeatWrapping;
    t.anisotropy = 8;
    if (srgb) t.colorSpace = THREE.SRGBColorSpace;
    return t;
  }

  // камень/терраццо – светлый фон с серыми вкраплениями и тонкими штрихами
  const stone = canvasTex(1024, (g, s) => {
    g.fillStyle = '#efedea'; g.fillRect(0, 0, s, s);
    for (let i = 0; i < 2600; i++) {
      const v = 120 + rnd() * 90 | 0;
      g.fillStyle = `rgba(${v},${v - 4},${v - 8},${0.25 + rnd() * 0.5})`;
      g.beginPath(); g.arc(rnd() * s, rnd() * s, 0.6 + rnd() * 1.8, 0, 7); g.fill();
    }
    g.lineCap = 'round';
    for (let i = 0; i < 260; i++) {
      const x = rnd() * s, y = rnd() * s, a = rnd() * 7, l = 6 + rnd() * 22;
      const v = 90 + rnd() * 80 | 0;
      g.strokeStyle = `rgba(${v},${v - 3},${v - 6},${0.35 + rnd() * 0.4})`;
      g.lineWidth = 0.8 + rnd() * 1.6;
      g.beginPath(); g.moveTo(x, y); g.lineTo(x + Math.cos(a) * l, y + Math.sin(a) * l); g.stroke();
    }
  });

  // паркет «ёлочка» (французская) – тёплый дуб
  const parquet = canvasTex(1024, (g, s) => {
    const cw = 512, ph = 128;
    g.fillStyle = '#7a5a3e'; g.fillRect(0, 0, s, s);
    for (let col = 0; col < s / cw; col++) {
      const x0 = col * cw, sl = col % 2 ? cw : -cw;
      for (let y = -2 * cw; y < s + 2 * cw; y += ph) {
        const k = rnd() * 22 - 11;
        g.fillStyle = `rgb(${172 + k | 0},${132 + k * 0.8 | 0},${94 + k * 0.6 | 0})`;
        g.beginPath();
        g.moveTo(x0, y); g.lineTo(x0 + cw, y + sl); g.lineTo(x0 + cw, y + sl + ph - 3); g.lineTo(x0, y + ph - 3);
        g.closePath(); g.fill();
        for (let f = 0; f < 10; f++) {                      // волокна дерева
          const t = rnd() * (ph - 8) + 3;
          g.strokeStyle = `rgba(95,62,35,${0.05 + rnd() * 0.08})`;
          g.lineWidth = 1 + rnd() * 2;
          g.beginPath(); g.moveTo(x0, y + t); g.lineTo(x0 + cw, y + sl + t); g.stroke();
        }
      }
    }
  });

  // штукатурка / окрашенная стена – едва заметный шум
  const plaster = canvasTex(512, (g, s) => {
    g.fillStyle = '#f1eeea'; g.fillRect(0, 0, s, s);
    for (let i = 0; i < 9000; i++) {
      const v = 225 + rnd() * 25 | 0;
      g.fillStyle = `rgba(${v},${v - 3},${v - 6},0.35)`;
      g.fillRect(rnd() * s, rnd() * s, 2, 2);
    }
  });

  // ЛДСП – мелкая текстура «текстиль/лён»
  const board = canvasTex(512, (g, s) => {
    g.fillStyle = '#ffffff'; g.fillRect(0, 0, s, s);
    for (let i = 0; i < s; i += 2) {
      g.fillStyle = `rgba(0,0,0,${0.015 + rnd() * 0.03})`; g.fillRect(0, i, s, 1);
      g.fillStyle = `rgba(0,0,0,${0.01 + rnd() * 0.02})`; g.fillRect(i, 0, 1, s);
    }
  });

  // ткань коробок
  const fabric = canvasTex(256, (g, s) => {
    g.fillStyle = '#ffffff'; g.fillRect(0, 0, s, s);
    for (let i = 0; i < s; i += 3) {
      g.fillStyle = 'rgba(0,0,0,0.06)'; g.fillRect(0, i, s, 1); g.fillRect(i, 0, 1, s);
    }
  });

  const MAPS = { stone, parquet, plaster, board, fabric };

  // UV в миллиметрах: текстура повторяется с шагом tile, а не растягивается по детали
  function boxUV(geo, sx, sy, sz, tile) {
    const uv = geo.attributes.uv;
    const dims = [[sz, sy], [sz, sy], [sx, sz], [sx, sz], [sx, sy], [sx, sy]];
    for (let f = 0; f < 6; f++)
      for (let k = 0; k < 4; k++) {
        const i = f * 4 + k;
        uv.setXY(i, uv.getX(i) * dims[f][0] / tile, uv.getY(i) * dims[f][1] / tile);
      }
  }

  const matCache = {};
  function material(key, spec) {
    if (matCache[key]) return matCache[key];
    let m;
    if (spec.basic) m = new THREE.MeshBasicMaterial({ color: spec.color });
    else {
      m = new THREE.MeshStandardMaterial({
        color: spec.color, roughness: spec.rough ?? 0.8, metalness: spec.metal ?? 0,
        envMapIntensity: spec.env ?? 1,
      });
      if (spec.map) m.map = MAPS[spec.map];
      if (spec.emissive) { m.emissive = new THREE.Color(spec.emissive); m.emissiveIntensity = spec.emissiveIntensity ?? 1; }
    }
    return (matCache[key] = m);
  }

  // силуэт вещи на плечиках: плечи, рукава-«крылья», чуть расширенный низ
  function garment(width, height, thick) {
    const w = width / 2, h = height;
    const sh = new THREE.Shape();
    sh.moveTo(-0.16 * w, 0);
    sh.quadraticCurveTo(0, -0.05 * w, 0.16 * w, 0);
    sh.lineTo(0.92 * w, -0.08 * w);
    sh.quadraticCurveTo(w, -0.12 * w, 0.96 * w, -0.2 * w);
    sh.lineTo(0.86 * w, -h + 0.05 * w);
    sh.quadraticCurveTo(0.86 * w, -h, 0.8 * w, -h);
    sh.lineTo(-0.8 * w, -h);
    sh.quadraticCurveTo(-0.86 * w, -h, -0.86 * w, -h + 0.05 * w);
    sh.lineTo(-0.96 * w, -0.2 * w);
    sh.quadraticCurveTo(-w, -0.12 * w, -0.92 * w, -0.08 * w);
    sh.closePath();
    const bev = Math.min(8, thick / 3);
    const geo = new THREE.ExtrudeGeometry(sh, { depth: Math.max(2, thick - 2 * bev), bevelEnabled: true,
      bevelThickness: bev, bevelSize: bev, bevelSegments: 2, curveSegments: 6 });
    geo.translate(0, h / 2, -(thick - 2 * bev) / 2);
    return geo;
  }

  // плечики: крючок + перекладина
  function hanger(width) {
    const g = new THREE.Group();
    const m = material('hanger', { color: 0x2b2826, rough: 0.4, metal: 0.3 });
    const bar = new THREE.Mesh(new THREE.CylinderGeometry(5, 5, width * 0.95, 8), m);
    bar.rotation.x = Math.PI / 2;
    const hook = new THREE.Mesh(new THREE.TorusGeometry(22, 3, 6, 12, Math.PI * 1.3), m);
    hook.position.y = 40;
    hook.rotation.y = Math.PI / 2;
    g.add(bar, hook);
    return g;
  }

  // главная функция: деталь [x0,x1,y0,y1,z0,z1] -> объект сцены
  function build(b, spec, key) {
    const [x0, x1, y0, y1, z0, z1] = b;
    const sx = x1 - x0, sy = z1 - z0, sz = y1 - y0;          // размеры в осях three (X, Y, Z)
    const pos = new THREE.Vector3((x0 + x1) / 2, (z0 + z1) / 2, (y0 + y1) / 2);
    const mat = material(key, spec);
    let obj;
    if (spec.shape === 'cloth') {
      const alongX = sx < sz;                                // толщина вещи вдоль X → штанга вдоль X
      const geo = garment(alongX ? sz : sx, sy, alongX ? sx : sz);
      if (alongX) geo.rotateY(Math.PI / 2);
      obj = new THREE.Group();
      const mesh = new THREE.Mesh(geo, mat);
      mesh.castShadow = mesh.receiveShadow = true;
      const hg = hanger(alongX ? sz : sx);
      hg.position.y = sy / 2 + 6;
      if (!alongX) hg.rotation.y = Math.PI / 2;
      obj.add(mesh, hg);
      obj.userData.mesh = mesh;
    } else if (spec.shape === 'shoe') {
      const geo = new THREE.CapsuleGeometry(0.5, 1, 4, 12);
      geo.rotateX(Math.PI / 2);
      geo.scale(sx, sy * 1.1, sz / 2);
      obj = new THREE.Mesh(geo, mat);
      pos.y -= sy * 0.05;
    } else if (spec.shape === 'rod') {
      const len = Math.max(sx, sz), r = Math.min(sx, sz, sy) / 2 + 2;
      const geo = new THREE.CylinderGeometry(r, r, len, 20);
      if (sx >= sz) geo.rotateZ(Math.PI / 2); else geo.rotateX(Math.PI / 2);
      obj = new THREE.Mesh(geo, mat);
    } else if (spec.shape === 'bar') {                        // ручка-рейлинг на двух опорах
      obj = new THREE.Group();
      const dims = [sx, sy, sz], long = dims.indexOf(Math.max(...dims));
      const rest = [0, 1, 2].filter(i => i !== long);
      const out = dims[rest[0]] >= dims[rest[1]] ? rest[0] : rest[1];     // ось «от фасада»
      const r = Math.min(dims[rest[0]], dims[rest[1]]) / 2;
      const axisRot = i => (i === 0 ? ['z', Math.PI / 2] : i === 2 ? ['x', Math.PI / 2] : null);
      const rod = new THREE.Mesh(new THREE.CylinderGeometry(r * 0.8, r * 0.8, dims[long], 16), mat);
      const ar = axisRot(long); if (ar) rod.rotation[ar[0]] = ar[1];
      rod.position.setComponent(out, dims[out] / 2 - r);
      obj.add(rod);
      for (const sgn of [-1, 1]) {
        const leg = new THREE.Mesh(new THREE.CylinderGeometry(r * 0.45, r * 0.45, dims[out], 10), mat);
        const lr = axisRot(out); if (lr) leg.rotation[lr[0]] = lr[1];
        leg.position.setComponent(long, sgn * (dims[long] / 2 - Math.min(40, dims[long] * 0.15)));
        obj.add(leg);
      }
      obj.children.forEach(c => { c.castShadow = true; });
    } else {
      const geo = new THREE.BoxGeometry(sx, sy, sz);
      if (spec.map) boxUV(geo, sx, sy, sz, spec.tile ?? 600);
      obj = new THREE.Mesh(geo, mat);
    }
    obj.position.copy(pos);
    if (obj.isMesh) { obj.castShadow = spec.shadow !== false; obj.receiveShadow = true; }
    return obj;
  }

  // свет: мягкое окружение (отражения) + основной источник с тенями
  function setup(renderer, scene) {
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.05;
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    // окружение – светлая «студия» с несколькими софтбоксами
    const env = new THREE.Scene();
    const room = new THREE.Mesh(new THREE.BoxGeometry(20, 12, 20),
      new THREE.MeshBasicMaterial({ color: 0x8f8a84, side: THREE.BackSide }));
    env.add(room);
    const panel = (w, h, x, y, z, ry, c) => {
      const p = new THREE.Mesh(new THREE.PlaneGeometry(w, h), new THREE.MeshBasicMaterial({ color: c, side: THREE.DoubleSide }));
      p.position.set(x, y, z); p.rotation.y = ry; p.lookAt(0, 0, 0);
      env.add(p);
    };
    panel(8, 4, 0, 5.5, 0, 0, 0xffffff);
    panel(6, 6, 9, 2, 3, 0, 0xfff3e2);
    panel(6, 6, -9, 2, -4, 0, 0xe8eeff);
    panel(10, 5, 0, 2, 9.5, 0, 0xffffff);
    const pm = new THREE.PMREMGenerator(renderer);
    scene.environment = pm.fromScene(env, 0.04).texture;
    pm.dispose();
    scene.add(new THREE.HemisphereLight(0xffffff, 0xb59a80, 0.35));
  }

  function sun(scene, pos, target, size) {
    const s = new THREE.DirectionalLight(0xfff6ea, 1.6);
    s.position.copy(pos);
    s.target.position.copy(target);
    s.castShadow = true;
    s.shadow.mapSize.set(2048, 2048);
    Object.assign(s.shadow.camera, { left: -size, right: size, top: size, bottom: -size, near: 100, far: 15000 });
    s.shadow.bias = -0.0004;
    s.shadow.normalBias = 2;
    s.shadow.radius = 4;
    scene.add(s, s.target);
    return s;
  }

  return { build, setup, sun, material, MAPS };
})();
</script>

host.appendChild(renderer.domElement);

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(45, 1, 20, 40000);

// внешний вид деталей по типу
const SPECS = {
  carcass:   { color: 0x9a948e, map: 'board', tile: 400, rough: 0.7 },
  back:      { color: 0x8e8882, map: 'board', tile: 400, rough: 0.8 },
  facade:    { color: 0x8e8882, map: 'board', tile: 500, rough: 0.55, env: 0.6 },
  top:       { color: 0x8e8882, map: 'board', tile: 500, rough: 0.5, env: 0.6 },
  plinth:    { color: 0x6e6863, rough: 0.8 },
  rose:      { color: 0xc4908c, map: 'board', tile: 400, rough: 0.6 },
  rose_back: { color: 0xb5827e, map: 'board', tile: 400, rough: 0.75 },
  drawer_box:{ color: 0xd8d2cb, map: 'board', tile: 300, rough: 0.8 },
  box:       { color: 0xcdc3b6, map: 'fabric', tile: 160, rough: 0.95 },
  box2:      { color: 0x8a7f74, map: 'fabric', tile: 160, rough: 0.95 },
  socket:    { color: 0xf4f2ee, rough: 0.35 },
  bed:       { color: 0xc98e88, map: 'fabric', tile: 120, rough: 1 },
  linen:     { color: 0xdedad5, map: 'fabric', tile: 200, rough: 1 },
  pillow:    { color: 0xb9b3ad, map: 'fabric', tile: 120, rough: 1 },
  pillow2:   { color: 0xe6e1db, map: 'fabric', tile: 120, rough: 1 },
  wall_back: { color: 0xa39d97, map: 'plaster', tile: 900, rough: 0.95, shadow: false },
  floor:     { color: 0xffffff, map: 'parquet', tile: 1200, rough: 0.5, shadow: false },
};
function specOf(kind) {
  if (kind.startsWith('book')) return { color: new THREE.Color(DATA.books[+kind.slice(4)]), rough: 0.85 };
  return SPECS[kind] || { color: 0x999999 };
}

// подвижные группы
const groups = {};
for (const [id, meta] of Object.entries(DATA.groups)) {
  const root = new THREE.Group();
  scene.add(root);
  const g = { id, meta, root, parent: root, slide: 0, slideTo: 0, rot: 0, rotTo: 0, state: 0 };
  if (meta.type === 'hinge') {
    g.pivot = new THREE.Group();
    g.pivot.position.set(meta.pivot[0], 0, meta.pivot[1]);
    root.add(g.pivot);
    g.parent = g.pivot;
  }
  groups[id] = g;
}

const pickable = [];
const walls = { wall_back: [] };
for (const b of DATA.boxes) {
  const [x0, x1, y0, y1, z0, z1, kind, gid] = b;
  const mesh = KIT.build(b, specOf(kind), kind);
  let parent = scene;
  if (gid) {
    const g = groups[gid];
    parent = g.parent;
    if (g.pivot) mesh.position.sub(g.pivot.position);
    mesh.traverse(o => { o.userData.gid = gid; if (o.isMesh) pickable.push(o); });
  }
  parent.add(mesh);
  if (kind.startsWith('wall')) walls[kind].push(mesh);
}

// свет
KIT.sun(scene, new THREE.Vector3(2600, 3600, 4200), new THREE.Vector3(700, 700, 300), 2600);
const M = DATA.meta;
// LED-лента под нишей: полоса + тёплое пятно на стене и столешнице
const strip = new THREE.Mesh(new THREE.BoxGeometry(M.w - 60, 6, 14), new THREE.MeshBasicMaterial({ color: 0xffe2b0 }));
strip.position.set(M.w / 2, M.zn0 - 4, M.ud - 30);
scene.add(strip);
for (const k of [0.2, 0.5, 0.8]) {
  const l = new THREE.PointLight(0xffd49a, 700, 1600, 1);
  l.position.set(M.w * k, M.zn0 - 40, M.ud - 60);
  scene.add(l);
}
{
  const c = document.createElement('canvas'); c.width = 8; c.height = 256;
  const x = c.getContext('2d'), gr = x.createLinearGradient(0, 0, 0, 256);
  gr.addColorStop(0, 'rgba(255,214,150,0.75)'); gr.addColorStop(1, 'rgba(255,214,150,0)');
  x.fillStyle = gr; x.fillRect(0, 0, 8, 256);
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace;
  const glow = new THREE.Mesh(new THREE.PlaneGeometry(M.w, 420),
    new THREE.MeshBasicMaterial({ map: t, transparent: true, blending: THREE.AdditiveBlending, depthWrite: false }));
  glow.position.set(M.w / 2, M.zn0 - 210, 2);
  scene.add(glow);
}
// ручки-полукруги Ø140 на ящиках
{
  const sh = new THREE.Shape();
  sh.absarc(0, 0, M.hr, Math.PI, 2 * Math.PI, false); sh.lineTo(-M.hr, 0);
  const geo = new THREE.ExtrudeGeometry(sh, { depth: 10, bevelEnabled: true, bevelThickness: 1.5, bevelSize: 1.5, bevelSegments: 2 });
  const mat = KIT.material('handle', { color: 0xe2afa6, rough: 0.45 });
  for (const [gid, x, y, z] of DATA.handles) {
    const m = new THREE.Mesh(geo, mat);
    m.position.set(x, z, y);
    m.castShadow = true;
    m.userData.gid = gid;
    groups[gid].parent.add(m);
    pickable.push(m);
  }
}
// кресло: «букле»-кольца на газлифте
{
  const ch = new THREE.Group();
  const boucle = KIT.material('boucle', { color: 0xeeeae3, map: 'fabric', rough: 1 });
  const cream = KIT.material('cream', { color: 0xe6dcc8, rough: 0.35, metal: 0.2 });
  const dark = KIT.material('caster', { color: 0x2a2826, rough: 0.5 });
  const add = (geo, m, x, y, z) => { const o = new THREE.Mesh(geo, m); o.position.set(x, y, z); o.castShadow = true; ch.add(o); return o; };
  add(new THREE.CylinderGeometry(220, 220, 25, 48), cream, 0, 440, 0);
  add(new THREE.CylinderGeometry(215, 215, 70, 48), boucle, 0, 490, 0);
  [570, 655, 740].forEach((y, i) => {
    const t = add(new THREE.TorusGeometry(205 - i * 4, 44, 18, 64, Math.PI * 1.25), boucle, 0, y, 0);
    t.rotation.x = -Math.PI / 2;
    t.rotation.z = Math.PI * 0.875;   // разрыв колец – к столу
  });
  add(new THREE.CylinderGeometry(20, 25, 320, 16), cream, 0, 270, 0);
  for (let l = 0; l < 5; l++) {
    const a = l * Math.PI * 2 / 5;
    const leg = add(new THREE.BoxGeometry(300, 24, 40), cream, Math.cos(a) * 150, 90, Math.sin(a) * 150);
    leg.rotation.y = -a;
    add(new THREE.SphereGeometry(28, 14, 10), dark, Math.cos(a) * 290, 30, Math.sin(a) * 290);
  }
  ch.position.set(860, 0, 640);
  scene.add(ch);
}
// бра у кровати
for (const z of [1350, 1200]) {
  const m = new THREE.Mesh(new THREE.CylinderGeometry(60, 60, 50, 32),
    new THREE.MeshStandardMaterial({ color: 0xe9d9b8, emissive: 0xffe2b0, emissiveIntensity: 0.7, roughness: 0.4 }));
  m.rotation.x = Math.PI / 2; m.position.set(M.w + 280, z, 30);
  scene.add(m);
}
renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
KIT.setup(renderer, scene);

// ---------------------------------------------------------------- камера
const target = new THREE.Vector3(800, 1250, 400);
const sph = { r: 4400, theta: 0.42, phi: 1.3 };
function placeCamera() {
  const s = Math.sin(sph.phi);
  camera.position.set(target.x + sph.r * s * Math.sin(sph.theta),
                      target.y + sph.r * Math.cos(sph.phi),
                      target.z + sph.r * s * Math.cos(sph.theta));
  camera.lookAt(target);
  // стены, которые оказались между камерой и комнатой, скрываем
  walls.wall_back.forEach(m => (m.visible = camera.position.z > 0));
}
let anim = null;      // плавный переход к заданному виду
function flyTo(r, theta, phi, t) {
  theta += 2 * Math.PI * Math.round((sph.theta - theta) / (2 * Math.PI));
  anim = { from: { ...sph, t: target.clone() }, to: { r, theta, phi, t }, k: 0 };
}

function resize() {
  const w = host.clientWidth, h = host.clientHeight;
  renderer.setSize(w, h);
  camera.aspect = w / h;
  camera.fov = w < h ? 62 : 45;
  camera.updateProjectionMatrix();
}
window.addEventListener('resize', resize);
resize();

// ---------------------------------------------------------------- управление
const el = renderer.domElement;
const ptrs = new Map();
let moved = 0, panMode = false, lastPinch = 0, lastMid = null;
el.addEventListener('contextmenu', e => e.preventDefault());
el.addEventListener('pointerdown', e => {
  el.setPointerCapture(e.pointerId);
  ptrs.set(e.pointerId, { x: e.clientX, y: e.clientY });
  moved = 0;
  panMode = e.button === 2 || e.shiftKey;
  lastPinch = 0; lastMid = null;
  anim = null;
});
function pan(dx, dy) {
  const k = sph.r * 0.0011;
  const right = new THREE.Vector3().setFromMatrixColumn(camera.matrix, 0);
  const up = new THREE.Vector3().setFromMatrixColumn(camera.matrix, 1);
  target.addScaledVector(right, -dx * k).addScaledVector(up, dy * k);
}
el.addEventListener('pointermove', e => {
  hover(e);
  const p = ptrs.get(e.pointerId);
  if (!p) return;
  const dx = e.clientX - p.x, dy = e.clientY - p.y;
  p.x = e.clientX; p.y = e.clientY;
  moved += Math.abs(dx) + Math.abs(dy);
  if (ptrs.size === 1) {
    if (panMode) pan(dx, dy);
    else {
      sph.theta -= dx * 0.006;
      sph.phi = Math.min(1.62, Math.max(0.08, sph.phi - dy * 0.006));
    }
  } else if (ptrs.size === 2) {
    const [a, b] = [...ptrs.values()];
    const dist = Math.hypot(a.x - b.x, a.y - b.y);
    const mid = { x: (a.x + b.x) / 2, y: (a.y + b.y) / 2 };
    if (lastPinch) sph.r = Math.min(12000, Math.max(500, sph.r * lastPinch / dist));
    if (lastMid) pan(mid.x - lastMid.x, mid.y - lastMid.y);
    lastPinch = dist; lastMid = mid;
  }
});
function release(e) {
  if (ptrs.size === 1 && moved < 8) pick(e);
  ptrs.delete(e.pointerId);
  lastPinch = 0; lastMid = null;
}
el.addEventListener('pointerup', release);
el.addEventListener('pointercancel', e => ptrs.delete(e.pointerId));
el.addEventListener('wheel', e => {
  e.preventDefault();
  anim = null;
  sph.r = Math.min(12000, Math.max(500, sph.r * Math.exp(e.deltaY * 0.0012)));
}, { passive: false });

// ---------------------------------------------------------------- выбор деталей
const ray = new THREE.Raycaster();
function hit(e) {
  const r = el.getBoundingClientRect();
  const v = new THREE.Vector2(((e.clientX - r.left) / r.width) * 2 - 1, -((e.clientY - r.top) / r.height) * 2 + 1);
  ray.setFromCamera(v, camera);
  const h = ray.intersectObjects(pickable, false)[0];
  return h ? groups[h.object.userData.gid] : null;
}
const NAMES = { hinge: 'Шкаф антресоли', slide: 'Ящик тумбы' };
const tip = document.getElementById('tip');
function hover(e) {
  if (e.pointerType !== 'mouse' || ptrs.size) { tip.style.display = 'none'; return; }
  const g = hit(e);
  el.style.cursor = g ? 'pointer' : 'grab';
  if (g) {
    tip.textContent = NAMES[g.meta.type];
    tip.style.left = e.clientX + 14 + 'px';
    tip.style.top = e.clientY + 14 + 'px';
    tip.style.display = 'block';
  } else tip.style.display = 'none';
}
function pick(e) {
  const g = hit(e);
  if (!g) return;
  toggle(g);
  syncButtons();
}

// ---------------------------------------------------------------- действия
const doors = Object.values(groups).filter(g => g.meta.type === 'hinge');
const shelves = Object.values(groups).filter(g => g.meta.type === 'slide');
function setOpen(g, open) {
  if (g.meta.type === 'hinge') {
    g.rotTo = open ? 1 : 0;
    // закрываем дверь – сначала задвигаем полки за ней
    if (!open) shelves.forEach(s => { if (s.meta.needs.includes(g.id)) s.slideTo = 0; });
  } else {
    g.slideTo = open ? 1 : 0;
    if (open) g.meta.needs.forEach(id => (groups[id].rotTo = 1));
  }
}
function toggle(g) { setOpen(g, (g.meta.type === 'hinge' ? g.rotTo : g.slideTo) < 0.5); }
function syncButtons() {
  const anyDoor = doors.some(d => d.rotTo > 0.5), anyShelf = shelves.some(s => s.slideTo > 0.5);
  bDoors.textContent = anyDoor ? 'Закрыть шкафы' : 'Открыть шкафы';
  bDoors.classList.toggle('on', anyDoor);
  bShoes.textContent = anyShelf ? 'Задвинуть ящики' : 'Выдвинуть ящики';
  bShoes.classList.toggle('on', anyShelf);
}
const bDoors = document.getElementById('bDoors');
const bShoes = document.getElementById('bShoes');
bDoors.onclick = () => { const open = !doors.some(d => d.rotTo > 0.5); doors.forEach(d => setOpen(d, open)); syncButtons(); };
bShoes.onclick = () => { const open = !shelves.some(s => s.slideTo > 0.5); shelves.forEach(s => setOpen(s, open)); syncButtons(); };
document.getElementById('bFront').onclick = () => flyTo(4400, 0.0, 1.5, new THREE.Vector3(700, 1330, 300));
document.getElementById('bSide').onclick = () => flyTo(3800, -0.9, 1.4, new THREE.Vector3(500, 1250, 300));
syncButtons();

// ---------------------------------------------------------------- цикл
let last = performance.now();
function approach(v, to, step) { return Math.abs(to - v) <= step ? to : v + Math.sign(to - v) * step; }
function ease(t) { return t < 0.5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2; }
function tick(now) {
  const dt = Math.min(0.05, (now - last) / 1000);
  last = now;
  const step = dt * 1.6;
  for (const g of Object.values(groups)) {
    if (g.meta.type === 'hinge') {
      // дверь не закрывается, пока за ней выдвинута полка
      const blocked = g.rotTo < g.rot && shelves.some(s => s.meta.needs.includes(g.id) && s.slide > 0);
      if (!blocked) g.rot = approach(g.rot, g.rotTo, step);
      g.pivot.rotation.y = ease(g.rot) * g.meta.angle * Math.PI / 180;
    } else {
      // полка выдвигается, только когда двери её отсека открыты
      const free = g.meta.needs.every(id => groups[id].rot > 0.95);
      if (g.slideTo < g.slide || free) g.slide = approach(g.slide, g.slideTo, step);
      const s = ease(g.slide) * g.meta.travel;
      g.root.position.set(g.meta.dir[0] * s, 0, g.meta.dir[1] * s);
    }
  }
  if (anim) {
    anim.k = Math.min(1, anim.k + dt * 1.4);
    const k = ease(anim.k), f = anim.from, t = anim.to;
    sph.r = f.r + (t.r - f.r) * k;
    sph.theta = f.theta + (t.theta - f.theta) * k;
    sph.phi = f.phi + (t.phi - f.phi) * k;
    target.lerpVectors(f.t, t.t, k);
    if (anim.k >= 1) anim = null;
  }
  placeCamera();
  renderer.render(scene, camera);
  requestAnimationFrame(tick);
}
requestAnimationFrame(tick);
</script>
