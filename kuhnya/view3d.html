<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Кухня 3D</title>
<style>
html,body{margin:0;height:100%;background:#eceae6;font-family:DejaVu Sans,Arial,sans-serif;overflow:hidden}
canvas{display:block;touch-action:none}
#ui{position:fixed;left:12px;top:12px;background:#fffe;border-radius:8px;padding:10px 12px;font-size:13px;line-height:1.7;box-shadow:0 1px 4px #0002;max-width:280px}
#ui b{font-size:14px}#ui label{display:block;cursor:pointer}
body.static #ui{display:none}
</style>
<script src="vendor/three.min.js"></script>
<script src="model.js"></script>
</head>
<body>
<div id="ui"><b>Кухня 5500 × 3000</b><br>
<label><input type="checkbox" id="fac" checked> фасады</label>
<label><input type="checkbox" id="ctx" checked> техника (условно)</label>
<span style="color:#666">мышь/палец — вращать, колесо/щипок — масштаб</span></div>
<script>
const P = new URLSearchParams(location.search);
const view = P.get('view');            // front | persp | open
if (view) document.body.classList.add('static');
const W = view ? 2000 : innerWidth, H = view ? 1300 : innerHeight;
const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
renderer.setPixelRatio(view ? 1 : devicePixelRatio);
renderer.setSize(W, H);
renderer.setClearColor(0xffffff);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.appendChild(renderer.domElement);
const scene = new THREE.Scene();
const C = { x: DIM.L / 2 };
const pos = (x, y, z) => new THREE.Vector3(x - C.x, z, y);      // Y — от стены к зрителю
const M = {
  'ЛДСП 16 белый': new THREE.MeshStandardMaterial({ color: 0xebebe8, roughness: 0.8 }),
  'МДФ 19 эмаль белая': new THREE.MeshStandardMaterial({ color: 0xf7f7f5, roughness: 0.35 }),
  'Столешница 38': new THREE.MeshStandardMaterial({ color: 0x8c8378, roughness: 0.5 }),
  'Цоколь ПВХ/МДФ белый': new THREE.MeshStandardMaterial({ color: 0xdedcd8, roughness: 0.6 }),
  'Стекло 8 закалённое': new THREE.MeshStandardMaterial({ color: 0xcfe6ee, transparent: true, opacity: 0.45, roughness: 0.1 }),
  'LED': new THREE.MeshBasicMaterial({ color: 0xfff4d6 }),
};
const edge = new THREE.LineBasicMaterial({ color: 0x777777, transparent: true, opacity: 0.5 });
const G = { fac: new THREE.Group(), ctx: new THREE.Group() };
scene.add(G.fac, G.ctx);
function box(x0, x1, y0, y1, z0, z1, mat, parent = scene, edges = true) {
  const g = new THREE.BoxGeometry(x1 - x0, z1 - z0, y1 - y0);
  const m = new THREE.Mesh(g, mat);
  m.position.copy(pos((x0 + x1) / 2, (y0 + y1) / 2, (z0 + z1) / 2));
  m.castShadow = m.receiveShadow = true;
  if (edges) m.add(new THREE.LineSegments(new THREE.EdgesGeometry(g), edge));
  parent.add(m);
  return m;
}
for (const p of PARTS) box(p.x0, p.x1, p.y0, p.y1, p.z0, p.z1, M[p.mat]);
const alu = new THREE.MeshStandardMaterial({ color: 0xa9adb1, metalness: 0.7, roughness: 0.3 });
const glass = new THREE.MeshStandardMaterial({ color: 0xbfd8e2, transparent: true, opacity: 0.28, roughness: 0.05 });
const gola = new THREE.MeshStandardMaterial({ color: 0x9a9ea2, metalness: 0.6, roughness: 0.35 });
for (const f of FACADES) {
  if (f.kind === 'glass') {
    const fr = 20;
    box(f.x0, f.x0 + fr, f.y, f.y + 19, f.z0, f.z1, alu, G.fac);
    box(f.x1 - fr, f.x1, f.y, f.y + 19, f.z0, f.z1, alu, G.fac);
    box(f.x0 + fr, f.x1 - fr, f.y, f.y + 19, f.z0, f.z0 + fr, alu, G.fac);
    box(f.x0 + fr, f.x1 - fr, f.y, f.y + 19, f.z1 - fr, f.z1, alu, G.fac);
    box(f.x0 + fr, f.x1 - fr, f.y + 8, f.y + 12, f.z0 + fr, f.z1 - fr, glass, G.fac, false);
  } else box(f.x0, f.x1, f.y, f.y + 19, f.z0, f.z1, M['МДФ 19 эмаль белая'], G.fac);
}
// профили Gola: L под столешницей, C между ящиками (утоплены)
box(DIM.X0, DIM.XT, 520, 560, DIM.ZB - DIM.GOLA, DIM.ZB - 2, gola, G.fac, false);
for (const f of FACADES.filter(f => f.kind === 'drawer' && f.z1 < 700)) box(f.x0, f.x1, 520, 560, f.z1 + 4, f.z1 + 28, gola, G.fac, false);
// техника для наглядности
const ctxM = { 'Холодильник 900 (отдельностоящий)': new THREE.MeshStandardMaterial({ color: 0xc9ccce, metalness: 0.4, roughness: 0.4 }),
  'Варочная панель': new THREE.MeshStandardMaterial({ color: 0x111111, roughness: 0.2 }),
  'Мойка': new THREE.MeshStandardMaterial({ color: 0xb9bcbf, metalness: 0.6, roughness: 0.3 }),
  'Вытяжка встраиваемая': new THREE.MeshStandardMaterial({ color: 0x8d9195, metalness: 0.6, roughness: 0.3 }) };
for (const c of CONTEXT) box(c.x0, c.x1, c.y0, c.y1, c.z0, c.z1, ctxM[c.name], G.ctx);
box(450 - 2, 450 + 2, 721, 740, 900, 1600, alu, G.ctx, false);
box(450 + 8, 450 + 12, 721, 740, 900, 1600, alu, G.ctx, false);
// стена, пол, потолочная линия
box(-200, DIM.L + 200, -40, 0, 0, DIM.H, new THREE.MeshStandardMaterial({ color: 0xf1eee9 }), scene, false);
const floor = new THREE.Mesh(new THREE.PlaneGeometry(20000, 20000), new THREE.MeshStandardMaterial({ color: 0xd9cfc0, roughness: 0.9 }));
floor.rotation.x = -Math.PI / 2; floor.receiveShadow = true; scene.add(floor);
scene.add(new THREE.HemisphereLight(0xffffff, 0xd8d2c8, 1.6));
const sun = new THREE.DirectionalLight(0xffffff, 0.9);
sun.position.set(-2500, 4000, 5000); sun.castShadow = true;
Object.assign(sun.shadow.camera, { left: -4000, right: 4000, top: 4000, bottom: -4000, near: 100, far: 20000 });
sun.shadow.mapSize.set(2048, 2048); scene.add(sun);
const glow = new THREE.PointLight(0xfff1d0, 0.5, 2600); glow.position.copy(pos(5050, 450, 1300)); scene.add(glow);

const cam = new THREE.PerspectiveCamera(32, W / H, 20, 60000);
let az = Math.PI / 2 + 0.35, el = 0.12, dist = 10500;
const target = new THREE.Vector3(0, 1450, 300);
if (view === 'front') { az = Math.PI / 2; el = 0.05; dist = 9300; }
if (view === 'open') { az = Math.PI / 2 - 0.45; el = 0.18; dist = 9800; G.fac.visible = false; }
function place() {
  cam.position.set(target.x + dist * Math.cos(el) * Math.cos(az), target.y + dist * Math.sin(el), target.z + dist * Math.cos(el) * Math.sin(az));
  cam.lookAt(target);
}
place();
document.getElementById('fac').onchange = e => { G.fac.visible = e.target.checked; draw(); };
document.getElementById('ctx').onchange = e => { G.ctx.visible = e.target.checked; draw(); };
let drag = null, pinch = null;
const cv = renderer.domElement;
cv.addEventListener('pointerdown', e => { drag = { x: e.clientX, y: e.clientY }; cv.setPointerCapture(e.pointerId); });
cv.addEventListener('pointermove', e => {
  if (!drag || pinch) return;
  az = Math.min(Math.PI - 0.1, Math.max(0.1, az + (e.clientX - drag.x) * 0.005));
  el = Math.min(1.3, Math.max(-0.1, el + (e.clientY - drag.y) * 0.004));
  drag = { x: e.clientX, y: e.clientY }; place(); draw();
});
cv.addEventListener('pointerup', () => drag = null);
cv.addEventListener('wheel', e => { e.preventDefault(); dist = Math.min(30000, Math.max(2000, dist * (1 + e.deltaY * 0.001))); place(); draw(); }, { passive: false });
cv.addEventListener('touchmove', e => {
  if (e.touches.length !== 2) { pinch = null; return; }
  const d = Math.hypot(e.touches[0].clientX - e.touches[1].clientX, e.touches[0].clientY - e.touches[1].clientY);
  if (pinch) { dist = Math.min(30000, Math.max(2000, dist * pinch / d)); place(); draw(); }
  pinch = d;
}, { passive: true });
cv.addEventListener('touchend', () => pinch = null);
addEventListener('resize', () => { if (view) return; renderer.setSize(innerWidth, innerHeight); cam.aspect = innerWidth / innerHeight; cam.updateProjectionMatrix(); draw(); });
function draw() { renderer.render(scene, cam); }
draw();
window.DONE = true;
</script>
</body>
</html>
